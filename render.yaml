services:
  - type: web
    name: careerconnect-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerconnect-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: careerconnect-db
    databaseName: careerconnect
    user: careerconnect
